<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MagicReader</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap.bundle.min.js"></script>
    <script src="/static/magicreaderclient.js"></script>
</head>
<body onload="onLoadBackupPage()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">MagicReader</a>
            <div class="subtitle text-light">{{host_address}}</div>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a href="/" class="nav-item nav-link">Controls</a>
                    <a href="/bands.html" class="nav-item nav-link">Bands</a>
                    <a href="/sequences.html" class="nav-item nav-link">Sequences</a>
                    <a href="/sounds.html" class="nav-item nav-link">Sounds</a>
                    <a href="/settings.html" class="nav-item nav-link">Settings</a>
                    <a href="/backup.html" class="nav-item nav-link active">Backup</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            System
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item bg-info text-light" href="#" onclick="showControlModalMagicWand()">Magic Wand</a></li>
                            <li><a class="dropdown-item bg-warning text-light" href="#" onclick="showControlModalReboot()">Reboot</a></li>
                            <li><a class="dropdown-item bg-danger text-light" href="#" onclick="showControlModalShutdown()">Shutdown</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="p-3 mt-3 mb-3 bg-light rounded-3 status-parent">
            <div class="h2 status-title">Status:</div>
            <div class="h2 status-message" id="status-message">Unknown</div>
            <div class="h4 status-readAllowed" id="status-readAllowed">RFID Read Allowed</div>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3">
            <h4>Backup</h4>
            <div class="row g-2 mb-3">
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="form-check">
                        <input class="form-check-input backup-option" type="checkbox" value="bands" id="backupBands" checked>
                        <label class="form-check-label" for="backupBands">Bands</label>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="form-check">
                        <input class="form-check-input backup-option" type="checkbox" value="sequences" id="backupSequences" checked>
                        <label class="form-check-label" for="backupSequences">Sequences</label>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="form-check">
                        <input class="form-check-input backup-option" type="checkbox" value="settings" id="backupSettings" checked>
                        <label class="form-check-label" for="backupSettings">Settings</label>
                    </div>
                </div>
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="form-check">
                        <input class="form-check-input backup-option" type="checkbox" value="sounds" id="backupSounds" checked>
                        <label class="form-check-label" for="backupSounds">Sounds</label>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-primary" onclick="buttonBackupSelected();">Backup</button>
            <span class="text-secondary ms-2" id="backupStatus"></span>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3">
            <h4>Restore</h4>
            <div class="backup-drop-zone mb-3" id="restoreDropZone">
                <input type="file" class="d-none" id="restoreFilesInput" multiple accept=".json,.zip,application/json,application/zip">
                <div class="fw-semibold">Drop backup files here</div>
                <div class="text-secondary">JSON backups for Bands, Sequences, or Settings, and ZIP backups for Sounds.</div>
                <button type="button" class="btn btn-outline-primary btn-sm mt-2" onclick="buttonChooseRestoreFiles();">Choose Files</button>
            </div>

            <div id="restorePreview"></div>

            <div class="restore-options d-none" id="restoreOptions">
                <div class="mb-2 fw-semibold">Import Mode</div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="restoreMode" id="restoreModeMerge" value="merge" checked>
                    <label class="form-check-label" for="restoreModeMerge">Merge with existing data</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="restoreMode" id="restoreModeOverwrite" value="overwrite">
                    <label class="form-check-label" for="restoreModeOverwrite">Overwrite existing data</label>
                </div>
                <button type="button" class="btn btn-danger mt-3" id="button-restoreSelected" onclick="buttonRestoreSelected();">Restore Selected</button>
                <span class="text-secondary ms-2" id="restoreStatus"></span>
            </div>
        </section>

        <div class="modal fade" id="controlModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-lg controlModal">
                <div class="modal-content" id="controlModalContent"></div>
            </div>
        </div>
    </main>
</body>
</html>
