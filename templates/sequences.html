<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MagicReader</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap.bundle.min.js"></script>
    <script src="/static/magicreaderclient.js"></script>
</head>
<body onload="onLoadSequencesPage()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">MagicReader</a>
            <div class="subtitle text-light">{{host_address}}</div>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a href="/" class="nav-item nav-link">Controls</a>
                    <a href="/bands.html" class="nav-item nav-link">Bands</a>
                    <a href="/sequences.html" class="nav-item nav-link active">Sequences</a>
                    <a href="#" class="nav-item nav-link disabled">Sounds</a>
                    <a href="#" class="nav-item nav-link disabled">Settings</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            System
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item bg-info text-light" href="#" onclick="showControlModalMagicWand()">Magic Wand</a></li>
                            <li><a class="dropdown-item bg-warning text-light" href="#" onclick="showControlModalReboot()">Reboot</a></li>
                            <li><a class="dropdown-item bg-danger text-light" href="#" onclick="showControlModalShutdown()">Shutdown</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="p-3 mt-3 mb-3 bg-light rounded-3 status-parent">
            <div class="h2 status-title">Status:</div>
            <div class="h2 status-message" id="status-message">Unknown</div>
            <div class="h4 status-readAllowed" id="status-readAllowed">RFID Read Allowed</div>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3 controls d-grid gap-2 d-md-block">
            <button type="button" class="btn btn-success" id="button-addNewSequence" onclick="buttonAddNewSequence();">Add New Sequence</button>
            <button type="button" class="btn btn-secondary" onclick="getFullSequenceList();">Refresh</button>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">Sequences</h4>
                <span class="text-secondary" id="sequencesTable-count"></span>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle" id="sequencesTable">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Cancel</th>
                            <th scope="col">Actions</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="sequencesTable_body"></tbody>
                </table>
            </div>
        </section>

        <div class="modal fade" id="editSequenceModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="editSequenceModalTitle">Edit Sequence</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="row mb-3">
                                <label for="editSequenceSequenceId" class="col-sm-3 col-form-label">Sequence ID</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="editSequenceSequenceId">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="editSequenceName" class="col-sm-3 col-form-label">Name</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="editSequenceName">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-sm-9 offset-sm-3">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="editSequenceCancelAllowed">
                                        <label class="form-check-label" for="editSequenceCancelAllowed">Allow taps to cancel sequence</label>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div class="border rounded p-3 bg-light">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h2 class="h6 mb-0">Actions</h2>
                                <button type="button" class="btn btn-sm btn-success" onclick="buttonAddSequenceAction();">Add Action</button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-2">
                                    <thead>
                                        <tr>
                                            <th scope="col">Type</th>
                                            <th scope="col">Delay</th>
                                            <th scope="col">Target</th>
                                            <th scope="col">Value</th>
                                            <th scope="col">Port</th>
                                            <th scope="col"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="editSequenceActionsTable_body"></tbody>
                                </table>
                            </div>
                            <div class="text-secondary" id="editSequenceActionsSummary"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="editSequenceModalSaveButton" onclick="buttonEditSequenceSave();">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="controlModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-lg controlModal">
                <div class="modal-content" id="controlModalContent"></div>
            </div>
        </div>
    </main>
</body>
</html>
