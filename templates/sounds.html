<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MagicReader</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/jquery-3.7.1.min.js"></script>
    <script src="/static/bootstrap.bundle.min.js"></script>
    <script src="/static/magicreaderclient.js"></script>
</head>
<body onload="onLoadSoundsPage()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="/" class="navbar-brand">MagicReader</a>
            <div class="subtitle text-light">{{host_address}}</div>
            <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a href="/" class="nav-item nav-link">Controls</a>
                    <a href="/bands.html" class="nav-item nav-link">Bands</a>
                    <a href="/sequences.html" class="nav-item nav-link">Sequences</a>
                    <a href="/sounds.html" class="nav-item nav-link active">Sounds</a>
                    <a href="/settings.html" class="nav-item nav-link">Settings</a>
                    <a href="/backup.html" class="nav-item nav-link">Backup</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            System
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item bg-info text-light" href="#" onclick="showControlModalMagicWand()">Magic Wand</a></li>
                            <li><a class="dropdown-item bg-warning text-light" href="#" onclick="showControlModalReboot()">Reboot</a></li>
                            <li><a class="dropdown-item bg-danger text-light" href="#" onclick="showControlModalShutdown()">Shutdown</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="p-3 mt-3 mb-3 bg-light rounded-3 status-parent">
            <div class="h2 status-title">Status:</div>
            <div class="h2 status-message" id="status-message">Unknown</div>
            <div class="h4 status-readAllowed" id="status-readAllowed">RFID Read Allowed</div>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3">
            <div class="row g-3 align-items-end">
                <div class="col-12 col-lg">
                    <label for="newSoundFile" class="form-label">Upload Sound</label>
                    <input type="file" class="form-control" id="newSoundFile" accept=".aac,.flac,.m4a,.mp3,.ogg,.wav,audio/*">
                </div>
                <div class="col-12 col-sm-auto">
                    <button type="button" class="btn btn-success w-100" id="button-uploadSound" onclick="buttonUploadSound();">
                        <span class="spinner-border spinner-border-sm d-none" role="status" id="button-uploadSound-spinner"></span>
                        <span id="button-uploadSound-text">Upload</span>
                    </button>
                </div>
                <div class="col-12 col-sm-auto">
                    <button type="button" class="btn btn-secondary w-100" onclick="getSoundsList();">Refresh</button>
                </div>
                <div class="col-12 col-lg-4 sound-disk">
                    <div class="d-flex justify-content-between gap-2">
                        <div class="fw-semibold">Storage</div>
                        <div class="text-secondary" id="soundsDiskSummary">Loading...</div>
                    </div>
                    <div class="progress sound-disk-progress" role="progressbar" aria-label="Disk usage" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" id="soundsDiskProgress" style="width: 0%"></div>
                    </div>
                    <div class="small text-secondary" id="soundsDiskDetail"></div>
                    <div class="small text-secondary sound-disk-path" id="soundsDiskPath"></div>
                </div>
            </div>
            <div class="text-secondary mt-2" id="soundsUploadStatus"></div>
        </section>

        <section class="p-3 mb-3 bg-light rounded-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="mb-0">Sounds</h4>
                <span class="text-secondary" id="soundsTable-count"></span>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle" id="soundsTable">
                    <thead>
                        <tr>
                            <th scope="col">File</th>
                            <th scope="col">Size</th>
                            <th scope="col">Modified</th>
                            <th scope="col">Preview</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="soundsTable_body"></tbody>
                </table>
            </div>
        </section>

        <div class="modal fade" id="renameSoundModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5">Rename Sound</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="mb-3">
                                <label for="renameSoundOriginalName" class="form-label">Current File</label>
                                <input type="text" class="form-control" id="renameSoundOriginalName" disabled>
                            </div>
                            <div class="mb-3">
                                <label for="renameSoundNewName" class="form-label">New File Name</label>
                                <input type="text" class="form-control" id="renameSoundNewName">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-primary" onclick="buttonRenameSoundSave();">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="controlModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-lg controlModal">
                <div class="modal-content" id="controlModalContent"></div>
            </div>
        </div>
    </main>
</body>
</html>
